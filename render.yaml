# Déploiement Render — adLyn : backend FastAPI + frontend statique (Vite/React).
# Même organisation que beauthentik.net (ShuyahBF/site-meetafrican).
#
# Deux services connectés à ce dépôt GitHub : chaque push sur la branche
# configurée redéploie les deux automatiquement.
#
# Les variables marquées "sync: false" ne sont PAS stockées ici (donc pas
# dans git) : Render les demande au premier déploiement (tableau de bord),
# puis les garde chiffrées.

services:
  - type: web
    name: adlyn-backend
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Nom de domaine de l'API (à décommenter quand il sera choisi, puis créer
    # l'enregistrement CNAME chez Cloudflare vers ce service Render) :
    # domains:
    #   - api.votre-domaine.com
    envVars:
      # Python figé : les versions de dépendances sont celles éprouvées sur beauthentik
      - key: PYTHON_VERSION
        value: 3.11.10

      # --- MongoDB Atlas (cluster partagé : collections préfixées "tlb_") ---
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: telecom_boutique
      - key: MONGO_COLLECTION_PREFIX
        value: tlb_

      # --- Connexion du personnel ---
      - key: JWT_SECRET
        generateValue: true

      # --- Adresse(s) du site public, séparées par des virgules. La PREMIÈRE
      # sert dans les liens envoyés aux clients, les QR codes et le retour
      # après paiement.
      - key: FRONTEND_ORIGIN
        sync: false

      # --- Premier compte administrateur de la plateforme ---
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # "true" le temps d'UN redéploiement pour réinitialiser le mot de passe
      - key: SUPER_ADMIN_RESET_PASSWORD
        value: "false"

      # --- PawaPay (Mobile Money) : même compte que beauthentik / Sawali ---
      - key: PAWAPAY_ENVIRONMENT
        sync: false
      - key: PAWAPAY_API_TOKEN_SANDBOX
        sync: false
      - key: PAWAPAY_API_TOKEN_PRODUCTION
        sync: false
      - key: PAWAPAY_CALLBACK_SECRET
        generateValue: true
      - key: PAWAPAY_DEFAULT_COUNTRY
        value: BFA
      - key: PAWAPAY_CUSTOMER_MESSAGE
        value: adLyn

      # --- Stockage Cloudflare R2 (obligatoire en production : le disque de
      # Render est effacé à chaque déploiement) ---
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_PUBLIC
        value: telecom-boutique-medias
      - key: R2_PUBLIC_BASE_URL
        sync: false

      # --- Catalogue public : publication quotidienne et assistant de recherche ---
      - key: CATALOGUE_HEURE_PUBLICATION
        value: "23"
      - key: FUSEAU_HORAIRE
        value: Africa/Ouagadougou
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- TikTok (connexion du compte de chaque boutique + publication des produits) ---
      # Client key / secret de l'app créée sur developers.tiktok.com
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # Adresse de retour déclarée dans le portail TikTok, ex. https://api.adlynservice.com/api/tiktok/callback
      - key: TIKTOK_REDIRECT_URI
        sync: false
      # Clé de chiffrement des jetons TikTok (python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
      - key: TIKTOK_JETONS_CLE
        sync: false
      - key: CATALOGUE_IA_MODELE
        value: claude-opus-5

      # --- Sauvegardes chiffrées des boutiques, chaque nuit à 00h ---
      # Clé AES-256 (32 octets en base64). À générer UNE fois :
      #   python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
      # et à conserver AUSSI hors de Render : sans elle, aucune restauration possible.
      - key: SAUVEGARDE_CLE
        sync: false
      - key: SAUVEGARDE_HEURE
        value: "0"
      - key: SAUVEGARDE_RETENTION_JOURS
        value: "30"
      # Google Drive (voir backend/outils/obtenir_jeton_gdrive.py)
      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false
      - key: GDRIVE_NOM_DOSSIER
        value: adLyn - Sauvegardes

      # --- Sauvegarde GÉNÉRALE automatique (toute la base, format .adlexport) vers R2 ---
      # Phrase de chiffrement (12 caractères minimum) : sans elle, sauvegarde DÉSACTIVÉE.
      # À conserver AUSSI hors de Render : sans elle, aucune restauration possible.
      - key: SAUVEGARDE_AUTO_PHRASE
        sync: false
      # Jeton secret du Cron Job (ex. : openssl rand -hex 32), envoyé dans l'en-tête X-Sauvegarde-Jeton
      - key: SAUVEGARDE_AUTO_JETON
        sync: false
      # Bucket R2 dédié (facultatif : à défaut R2_BUCKET_PRIVE) ; identifiants R2 ci-dessus réutilisés
      - key: ADLYN_SAUVEGARDES_BUCKET
        sync: false
      # Dossier des archives des boutiques supprimées après non-renouvellement (cycle de vie)
      - key: ADLYN_ARCHIVES_PREFIXE
        value: archives-locataires/

      # --- Rapport de la nuit (sauvegardes + catalogue) ---
      - key: RAPPORT_EMAIL
        value: jfrancois.ouoba@gmail.com
      # E-mails de la plateforme : le service (Resend, ZeptoMail, Brevo ou SMTP) se
      # choisit dans l'écran Plateforme > Paramètres (clés chiffrées en base). Les
      # variables ci-dessous sont FACULTATIVES : valeurs de repli quand rien n'est réglé
      # dans l'écran, dans cet ordre : 1. Resend ; 2. SMTP ; puis Brevo, ZeptoMail.
      # 1. Resend (API HTTPS) : clé + adresse sur un domaine validé, ex. noreply@mondomaine.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_EXPEDITEUR
        sync: false
      # 2. Serveur SMTP (PLATEFORME_SMTP_* ou SMTP_*) : bloqué sur les services Render
      # gratuits (ports 25, 465, 587), seulement avec une offre payante (Starter)
      - key: PLATEFORME_SMTP_HOTE
        sync: false
      - key: PLATEFORME_SMTP_PORT
        value: "587"
      - key: PLATEFORME_SMTP_UTILISATEUR
        sync: false
      - key: PLATEFORME_SMTP_MOT_DE_PASSE
        sync: false
      - key: PLATEFORME_EXPEDITEUR
        sync: false
      # 3. Brevo et ZeptoMail (API HTTPS), avec l'adresse commune EMAIL_EXPEDITEUR
      - key: EMAIL_EXPEDITEUR
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ZEPTOMAIL_API_KEY
        sync: false
      # Région ZeptoMail : api.zeptomail.com (défaut), api.zeptomail.eu ou api.zeptomail.in
      - key: ZEPTOMAIL_HOTE
        value: api.zeptomail.com

      # --- Bucket R2 PRIVÉ (pièces KYC, sauvegardes avant restauration) ---
      - key: R2_BUCKET_PRIVE
        value: telecom-boutique-kyc

      # --- SMS (identifiants envoyés au DG d'une boutique créée par le webhook) ---
      # Mêmes comptes que beauthentik.net : Orange SMS API, OVH en repli
      - key: ORANGE_SMS_CLIENT_ID
        sync: false
      - key: ORANGE_SMS_CLIENT_SECRET
        sync: false
      - key: ORANGE_SMS_SENDER_MSISDN
        sync: false
      - key: ORANGE_SMS_SENDER_NAME
        sync: false
      - key: OVH_SMS_APPLICATION_KEY
        sync: false
      - key: OVH_SMS_APPLICATION_SECRET
        sync: false
      - key: OVH_SMS_CONSUMER_KEY
        sync: false
      - key: OVH_SMS_SERVICE_NAME
        sync: false
      - key: OVH_SMS_SENDER
        sync: false

      # --- WhatsApp Cloud API (rappels d'abonnement) : même compte que beauthentik ---
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Modèle « Utility » approuvé par Meta, 3 variables : boutique, échéance, montant
      - key: WHATSAPP_RAPPEL_TEMPLATE
        sync: false
      # Fiche de maintenance des équipements : modèles « Utility » à 6 variables (émetteur,
      # n° de fiche, matériel, statut, prix du diagnostic, lien de paiement), sans en-tête
      # et avec en-tête IMAGE (1re photo de la fiche). Facultatifs.
      - key: WHATSAPP_MAINTENANCE_TEMPLATE
        sync: false
      - key: WHATSAPP_MAINTENANCE_TEMPLATE_IMAGE
        sync: false
      # Codes de vérification (mot de passe oublié, changement d'identifiant) et mots de
      # passe provisoires : modèle de catégorie « Authentication » (1 variable = le code,
      # bouton « Copier le code »). Sans lui : message texte (fenêtre de 24 h) puis SMS.
      - key: WHATSAPP_CODE_TEMPLATE
        sync: false
      # Facultatif : modèle « Utility » envoyé avant le mot de passe provisoire, 4 variables :
      # nom de la personne, nom de la boutique, ID boutique, identifiant de connexion
      - key: WHATSAPP_IDENTIFIANTS_TEMPLATE
        sync: false

      # --- Transmission WA Universelle Liluvine (SAWALI) ---
      # Repli quand adLyn n'a pas de paramètres WABA (ni pour la boutique concernée,
      # ni pour la plateforme) : le message texte est transmis à SAWALI, qui l'envoie.
      # Sans URL ou sans clé, la transmission universelle est simplement désactivée.
      # URL du webhook SAWALI : https://<domaine SAWALI>/api/webhook/liluvine-send
      - key: LILUVINE_WA_URL
        sync: false
      # Clé HMAC propre à adLyn, générée dans SAWALI (secrète : saisie dans Render)
      - key: LILUVINE_WA_HMAC
        sync: false
      # Code émetteur d'adLyn chez SAWALI (pas secret)
      - key: LILUVINE_WA_EMETTEUR
        value: "adlyn"

      # --- Maintenance des équipements : prix du diagnostic proposé (FCFA) ---
      - key: MAINTENANCE_PRIX_DIAGNOSTIC
        value: "10000"

      # --- Abonnements ---
      - key: ABONNEMENT_ESSAI_JOURS
        value: "14"
      - key: ABONNEMENT_RAPPEL_JOURS_AVANT
        value: "3"

      # --- Webhook de création des boutiques (signature HMAC-SHA256) ---
      # Secret partagé avec le système appelant (ex. : openssl rand -hex 32).
      # Sans lui, le webhook reste fermé.
      - key: WEBHOOK_BOUTIQUES_SECRET
        sync: false
      - key: WEBHOOK_QUOTA_JOUR
        value: "20"

  # Cron Job de la sauvegarde générale (à créer dans Render, service payant ; laissé en
  # commentaire pour ne rien créer automatiquement). Il réveille le serveur et déclenche
  # la sauvegarde du jour (idempotente : un second appel le même jour ne refait rien).
  # - type: cron
  #   name: adlyn-sauvegarde-generale
  #   runtime: docker | python
  #   schedule: "30 1 * * *"   # 01h30 UTC chaque nuit
  #   # Puis, avec le même jeton, la tâche quotidienne du cycle de vie des abonnements non
  #   # renouvelés (J+103 / J+110 / J+112 / J+113, backend/cycle_vie.py ; idempotente aussi).
  #   # Le « sleep » laisse la sauvegarde générale du jour se faire AVANT tout archivage.
  #   startCommand: >-
  #     curl -fsS -X POST -H "X-Sauvegarde-Jeton: $SAUVEGARDE_AUTO_JETON"
  #     https://<adresse-du-backend>/api/sauvegarde-auto/declencher
  #     && sleep 900 &&
  #     curl -fsS -X POST -H "X-Sauvegarde-Jeton: $SAUVEGARDE_AUTO_JETON"
  #     https://<adresse-du-backend>/api/cycle-vie/declencher
  #   envVars:
  #     - key: SAUVEGARDE_AUTO_JETON
  #       sync: false

  - type: web
    name: adlyn-frontend
    runtime: static
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # domains:
    #   - votre-domaine.com
    #   - www.votre-domaine.com
    envVars:
      # Adresse de l'API = URL du service backend ci-dessus + /api
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Application React (React Router) : toute adresse retombe sur index.html,
      # sinon recharger /b/ma-boutique ou /gestion donnerait une erreur 404.
      - type: rewrite
        source: /*
        destination: /index.html
